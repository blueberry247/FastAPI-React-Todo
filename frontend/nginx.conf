server {
  # Nginx serves the React frontend on port 80.
  listen 80;
  server_name _;

  # React build files are copied here by frontend/Dockerfile.
  root /usr/share/nginx/html;
  index index.html;

  # Optional API prefix. Requests to /api/* are forwarded to FastAPI.
  location /api/ {
    proxy_pass http://backend:4000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The existing React code calls /items/* directly, so proxy that route to FastAPI.
  location /items/ {
    proxy_pass http://backend:4000/items/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The existing React code calls /users/* directly, so proxy that route to FastAPI.
  location /users/ {
    proxy_pass http://backend:4000/users/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy FastAPI Swagger documentation through the frontend domain.
  location /docs {
    proxy_pass http://backend:4000/docs;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy ReDoc documentation through the frontend domain.
  location /redoc {
    proxy_pass http://backend:4000/redoc;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Required by Swagger UI and ReDoc to load the API schema.
  location /openapi.json {
    proxy_pass http://backend:4000/openapi.json;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # React single-page app fallback for frontend routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
