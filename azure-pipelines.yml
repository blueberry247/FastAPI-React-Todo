trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:
- stage: Validate
  displayName: Validate Application

  jobs:
  - job: ValidateRepository
    displayName: Validate Repository

    steps:
    - checkout: self

    - script: |
        echo "Repository checked out successfully"
        echo "Current directory:"
        pwd
        echo "Repository files:"
        ls -la
        echo "Backend:"
        ls -la Backend
        echo "Frontend:"
        ls -la frontend
      displayName: Check repository structure