# Run this pipeline automatically when code is pushed to the main branch.
trigger:
  branches:
    include:
      - main

# Run this pipeline when a pull request targets main.
pr:
  branches:
    include:
      - main

# Microsoft-hosted Ubuntu build agent.
pool:
  vmImage: ubuntu-latest

stages:

# =========================================================
# STAGE 1 - VALIDATE
# =========================================================
- stage: Validate
  displayName: Validate Application

  jobs:
  - job: ValidateRepository
    displayName: Validate Repository

    steps:
    - checkout: self

    - script: |
        echo "Repository checked out successfully"
        echo "Current directory:"
        pwd

        echo "Repository files:"
        ls -la

        echo "Backend:"
        ls -la Backend

        echo "Frontend:"
        ls -la frontend
      displayName: Check repository structure


# =========================================================
# STAGE 2 - DEPENDENCY SCAN
# =========================================================
- stage: DependencyScan
  displayName: Dependency Scan
  dependsOn: Validate
  condition: succeeded()

  jobs:
  - job: TrivyDependencyScan
    displayName: Trivy Dependency Scan

    steps:
    - checkout: self

    - script: |
        sudo apt-get update
        sudo apt-get install -y wget apt-transport-https gnupg lsb-release

        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
          | gpg --dearmor \
          | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
          | sudo tee /etc/apt/sources.list.d/trivy.list

        sudo apt-get update
        sudo apt-get install -y trivy
      displayName: Install Trivy

    - script: |
        trivy fs \
          --scanners vuln \
          --severity HIGH,CRITICAL \
          --exit-code 1 \
          .
      displayName: Scan application dependencies


# =========================================================
# STAGE 3 - SECRET SCAN
# =========================================================
- stage: SecretScan
  displayName: Secret Scan
  dependsOn: DependencyScan
  condition: succeeded()

  jobs:
  - job: TrivySecretScan
    displayName: Trivy Secret Detection

    steps:
    - checkout: self

    - script: |
        sudo apt-get update
        sudo apt-get install -y wget apt-transport-https gnupg lsb-release

        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
          | gpg --dearmor \
          | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
          | sudo tee /etc/apt/sources.list.d/trivy.list

        sudo apt-get update
        sudo apt-get install -y trivy
      displayName: Install Trivy

    - script: |
        trivy fs \
          --scanners secret \
          --exit-code 1 \
          .
      displayName: Scan repository for secrets


# =========================================================
# STAGE 4 - BUILD AND IMAGE SCAN
# =========================================================
- stage: BuildAndImageScan
  displayName: Build and Scan Docker Images
  dependsOn: SecretScan
  condition: succeeded()

  jobs:
  - job: BuildAndScan
    displayName: Build and Scan Backend and Frontend

    steps:
    - checkout: self

    # -----------------------------------------------------
    # Build Backend Docker Image
    # -----------------------------------------------------
    - task: Docker@2
      displayName: Build Backend Docker Image
      inputs:
        repository: 'taskapp_backend'
        command: 'build'
        Dockerfile: 'Backend/Dockerfile'
        buildContext: 'Backend'
        addPipelineData: false
        addBaseImageData: false
        arguments: '--provenance=false'
        tags: |
          $(Build.BuildId)

    # -----------------------------------------------------
    # Build Frontend Docker Image
    # -----------------------------------------------------
    - task: Docker@2
      displayName: Build Frontend Docker Image
      inputs:
        repository: 'taskapp_frontend'
        command: 'build'
        Dockerfile: 'frontend/Dockerfile'
        buildContext: 'frontend'
        addPipelineData: false
        addBaseImageData: false
        arguments: '--provenance=false'
        tags: |
          $(Build.BuildId)

    # -----------------------------------------------------
    # Install Trivy
    # -----------------------------------------------------
    - script: |
        sudo apt-get update
        sudo apt-get install -y wget apt-transport-https gnupg lsb-release

        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
          | gpg --dearmor \
          | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
          | sudo tee /etc/apt/sources.list.d/trivy.list

        sudo apt-get update
        sudo apt-get install -y trivy
      displayName: Install Trivy

    # -----------------------------------------------------
    # Scan Backend Docker Image
    # -----------------------------------------------------
    - script: |
        trivy image \
          --scanners vuln \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 1 \
          taskapp_backend:$(Build.BuildId)
      displayName: Scan Backend Docker Image

    # -----------------------------------------------------
    # Scan Frontend Docker Image
    # -----------------------------------------------------
    - script: |
        trivy image \
          --scanners vuln \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 1 \
          taskapp_frontend:$(Build.BuildId)
      displayName: Scan Frontend Docker Image


# =========================================================
# STAGE 5 - PUSH IMAGES TO ACR
# =========================================================
- stage: PushToACR
  displayName: Push Docker Images to ACR
  dependsOn: BuildAndImageScan
  condition: succeeded()

  jobs:
  - job: PushImages
    displayName: Push Backend and Frontend Images

    steps:
    - checkout: self

    - task: Docker@2
      displayName: Build and Push Backend Image
      inputs:
        containerRegistry: 'taskapp-acr-service-connection'
        repository: 'taskapp_backend'
        command: 'buildAndPush'
        Dockerfile: 'Backend/Dockerfile'
        buildContext: 'Backend'
        tags: |
          $(Build.BuildId)
          latest

    - task: Docker@2
      displayName: Build and Push Frontend Image
      inputs:
        containerRegistry: 'taskapp-acr-service-connection'
        repository: 'taskapp_frontend'
        command: 'buildAndPush'
        Dockerfile: 'frontend/Dockerfile'
        buildContext: 'frontend'
        tags: |
          $(Build.BuildId)
          latest


# =========================================================
# STAGE 6 - DEPLOY BACKEND
# =========================================================
- stage: DeployBackend
  displayName: Deploy Backend
  dependsOn: PushToACR
  condition: succeeded()

  jobs:
  - job: DeployBackendApp
    displayName: Deploy Backend App Service

    steps:
    - task: AzureWebAppContainer@1
      displayName: Deploy Backend Container
      inputs:
        azureSubscription: 'taskapp-azure-service-connection'
        appName: 'taskapp-backend247'
        containers: 'taskappacr247.azurecr.io/taskapp_backend:$(Build.BuildId)'