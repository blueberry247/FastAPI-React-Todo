# =========================================================
# TASKAPP AZURE DEVOPS CI/CD PIPELINE
# =========================================================
# This pipeline:
# 1. Scans the repository for dependency vulnerabilities and secrets.
# 2. Builds backend and frontend Docker images.
# 3. Scans Docker images before publishing.
# 4. Pushes approved images to Azure Container Registry.
# 5. Deploys backend and frontend containers to Azure App Service.
# =========================================================

trigger:
  branches:
    include:
      # Run pipeline automatically when code is pushed to main.
      - main

pr:
  branches:
    include:
      # Run validation automatically when a pull request targets main.
      - main

pool:
  # Use a Microsoft-hosted Ubuntu build agent.
  vmImage: ubuntu-latest

variables:
  # Azure Container Registry login server.
  acrLoginServer: taskappacr247.azurecr.io

  # Azure DevOps service connection for ACR.
  acrServiceConnection: taskapp-acr-service-connection

  # Azure DevOps service connection for Azure App Service deployment.
  azureServiceConnection: taskapp-azure-service-connection

  # Docker image repository names.
  backendImage: taskapp_backend
  frontendImage: taskapp_frontend

  # Azure App Service names.
  backendAppName: taskapp-backend247
  frontendAppName: taskapp-web247

stages:
# =========================================================
# STAGE 1 - SECURITY SCANS
# =========================================================
# This stage scans the source code before any Docker images are pushed.
# It blocks the pipeline if HIGH/CRITICAL vulnerabilities or secrets are found.
# =========================================================
- stage: SecurityScan
  displayName: Security Scans

  jobs:
  - job: ScanRepository
    displayName: Dependency and Secret Scans

    steps:
    # Download the repository code to the build agent.
    - checkout: self

    # Install Trivy from Aqua Security's official apt repository.
    - script: |
        sudo apt-get update
        sudo apt-get install -y wget apt-transport-https gnupg lsb-release

        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
          | gpg --dearmor \
          | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
          | sudo tee /etc/apt/sources.list.d/trivy.list

        sudo apt-get update
        sudo apt-get install -y trivy
      displayName: Install Trivy

    # Scan the repository files for dependency vulnerabilities.
    # The pipeline fails if HIGH or CRITICAL issues are found.
    - script: |
        trivy fs \
          --scanners vuln \
          --severity HIGH,CRITICAL \
          --exit-code 1 \
          .
      displayName: Scan Dependencies

    # Scan the repository for committed passwords, tokens, or keys.
    # The pipeline fails if secrets are found.
    - script: |
        trivy fs \
          --scanners secret \
          --exit-code 1 \
          .
      displayName: Scan Secrets

# =========================================================
# STAGE 2 - BUILD, SCAN AND PUSH IMAGES
# =========================================================
# This stage builds backend/frontend images, scans them, and only pushes them
# to ACR if the image scans pass.
# =========================================================
- stage: BuildScanPush
  displayName: Build, Scan and Push Images
  dependsOn: SecurityScan
  condition: succeeded()

  jobs:
  - job: BuildScanPushImages
    displayName: Build, Scan and Push Docker Images

    steps:
    # Download the repository code to the build agent.
    - checkout: self

    # Login to Azure Container Registry so Docker can push images later.
    - task: Docker@2
      displayName: Login to ACR
      inputs:
        command: login
        containerRegistry: $(acrServiceConnection)

    # Build backend and frontend images locally on the build agent.
    # --pull gets the latest base image.
    # --no-cache avoids stale dependency/image layers.
    # DOCKER_BUILDKIT=0 avoids BuildKit SBOM metadata false positives.
    - script: |
        export DOCKER_BUILDKIT=0

        docker build --pull --no-cache \
          -t $(backendImage):$(Build.BuildId) \
          -f Backend/Dockerfile \
          Backend

        docker build --pull --no-cache \
          -t $(frontendImage):$(Build.BuildId) \
          -f frontend/Dockerfile \
          frontend
      displayName: Build Docker Images

    # Scan both Docker images before pushing them to ACR.
    # Uses .trivyignore for approved false positives.
    # The pipeline fails if HIGH/CRITICAL vulnerabilities are found.
    - script: |
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v $(Build.SourcesDirectory):/workspace \
          aquasec/trivy:latest image \
          --scanners vuln \
          --ignorefile /workspace/.trivyignore \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 1 \
          $(backendImage):$(Build.BuildId)

        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v $(Build.SourcesDirectory):/workspace \
          aquasec/trivy:latest image \
          --scanners vuln \
          --ignorefile /workspace/.trivyignore \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 1 \
          $(frontendImage):$(Build.BuildId)
      displayName: Scan Docker Images

    # Add ACR tags to the already-scanned local images.
    # Build ID gives an immutable version.
    # latest gives a convenient moving tag.
    - script: |
        docker tag $(backendImage):$(Build.BuildId) $(acrLoginServer)/$(backendImage):$(Build.BuildId)
        docker tag $(backendImage):$(Build.BuildId) $(acrLoginServer)/$(backendImage):latest

        docker tag $(frontendImage):$(Build.BuildId) $(acrLoginServer)/$(frontendImage):$(Build.BuildId)
        docker tag $(frontendImage):$(Build.BuildId) $(acrLoginServer)/$(frontendImage):latest
      displayName: Tag Docker Images

    # Push only the scanned and approved images to Azure Container Registry.
    - script: |
        docker push $(acrLoginServer)/$(backendImage):$(Build.BuildId)
        docker push $(acrLoginServer)/$(backendImage):latest

        docker push $(acrLoginServer)/$(frontendImage):$(Build.BuildId)
        docker push $(acrLoginServer)/$(frontendImage):latest
      displayName: Push Docker Images

# =========================================================
# STAGE 3 - DEPLOY BACKEND
# =========================================================
# Deploys the backend container image from ACR to Azure App Service.
# =========================================================
- stage: DeployBackend
  displayName: Deploy Backend
  dependsOn: BuildScanPush
  condition: succeeded()

  jobs:
  - job: DeployBackendApp
    displayName: Deploy Backend App Service

    steps:
    - task: AzureWebAppContainer@1
      displayName: Deploy Backend Container
      inputs:
        azureSubscription: $(azureServiceConnection)
        appName: $(backendAppName)
        containers: $(acrLoginServer)/$(backendImage):$(Build.BuildId)

# =========================================================
# STAGE 4 - DEPLOY FRONTEND
# =========================================================
# Deploys the frontend container image from ACR to Azure App Service.
# Runs after backend deployment succeeds.
# =========================================================
- stage: DeployFrontend
  displayName: Deploy Frontend
  dependsOn: DeployBackend
  condition: succeeded()

  jobs:
  - job: DeployFrontendApp
    displayName: Deploy Frontend App Service

    steps:
    - task: AzureWebAppContainer@1
      displayName: Deploy Frontend Container
      inputs:
        azureSubscription: $(azureServiceConnection)
        appName: $(frontendAppName)
        containers: $(acrLoginServer)/$(frontendImage):$(Build.BuildId)