# =========================================================
# TASKAPP AZURE DEVOPS CI/CD PIPELINE
# =========================================================

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:

# =========================================================
# STAGE 1 - VALIDATE REPOSITORY
# =========================================================

- stage: Validate
  displayName: Validate Application

  jobs:
  - job: ValidateRepository
    displayName: Validate Repository

    steps:
    - checkout: self

    - script: |
        echo "Repository checked out successfully"
        echo "Current directory:"
        pwd

        echo "Backend files:"
        ls -la Backend

        echo "Frontend files:"
        ls -la frontend
      displayName: Check Repository Structure


# =========================================================
# STAGE 2 - DEPENDENCY SCAN
# =========================================================

- stage: DependencyScan
  displayName: Dependency Scan
  dependsOn: Validate
  condition: succeeded()

  jobs:
  - job: TrivyDependencyScan
    displayName: Trivy Dependency Scan

    steps:
    - checkout: self

    - script: |
        sudo apt-get update
        sudo apt-get install -y wget apt-transport-https gnupg lsb-release

        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
          | gpg --dearmor \
          | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
          | sudo tee /etc/apt/sources.list.d/trivy.list

        sudo apt-get update
        sudo apt-get install -y trivy
      displayName: Install Trivy

    - script: |
        trivy fs \
          --scanners vuln \
          --severity HIGH,CRITICAL \
          --exit-code 1 \
          .
      displayName: Scan Application Dependencies


# =========================================================
# STAGE 3 - SECRET SCAN
# =========================================================

- stage: SecretScan
  displayName: Secret Scan
  dependsOn: DependencyScan
  condition: succeeded()

  jobs:
  - job: TrivySecretScan
    displayName: Trivy Secret Detection

    steps:
    - checkout: self

    - script: |
        sudo apt-get update
        sudo apt-get install -y wget apt-transport-https gnupg lsb-release

        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
          | gpg --dearmor \
          | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
          | sudo tee /etc/apt/sources.list.d/trivy.list

        sudo apt-get update
        sudo apt-get install -y trivy
      displayName: Install Trivy

    - script: |
        trivy fs \
          --scanners secret \
          --exit-code 1 \
          .
      displayName: Scan Repository For Secrets


# =========================================================
# STAGE 4 - BUILD AND SCAN DOCKER IMAGES
# =========================================================

- stage: BuildAndImageScan
  displayName: Build and Scan Docker Images
  dependsOn: SecretScan
  condition: succeeded()

  jobs:
  - job: BuildAndScan
    displayName: Build and Scan Backend and Frontend

    steps:
    - checkout: self

    # -----------------------------------------------------
    # Build Backend Docker Image WITHOUT BuildKit
    # -----------------------------------------------------

    - script: |
        export DOCKER_BUILDKIT=0

        docker build \
          --pull \
          --no-cache \
          -t taskapp_backend:$(Build.BuildId) \
          -f Backend/Dockerfile \
          Backend
      displayName: Build Backend Docker Image

    # -----------------------------------------------------
    # Build Frontend Docker Image
    # -----------------------------------------------------

    - task: Docker@2
      displayName: Build Frontend Docker Image
      inputs:
        repository: 'taskapp_frontend'
        command: 'build'
        Dockerfile: 'frontend/Dockerfile'
        buildContext: 'frontend'
        addPipelineData: false
        addBaseImageData: false
        arguments: '--pull --no-cache --provenance=false --sbom=false'
        tags: |
          $(Build.BuildId)

    # -----------------------------------------------------
    # Install Trivy
    # -----------------------------------------------------

    - script: |
        sudo apt-get update
        sudo apt-get install -y wget apt-transport-https gnupg lsb-release

        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
          | gpg --dearmor \
          | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
          | sudo tee /etc/apt/sources.list.d/trivy.list

        sudo apt-get update
        sudo apt-get install -y trivy
      displayName: Install Trivy

    # -----------------------------------------------------
    # Scan Backend Docker Image
    # -----------------------------------------------------

    - script: |
        trivy image \
          --scanners vuln \
          --ignorefile .trivyignore \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 1 \
          taskapp_backend:$(Build.BuildId)
      displayName: Scan Backend Docker Image

    # -----------------------------------------------------
    # Scan Frontend Docker Image
    # -----------------------------------------------------

    - script: |
        trivy image \
          --scanners vuln \
          --ignorefile .trivyignore \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 1 \
          taskapp_frontend:$(Build.BuildId)
      displayName: Scan Frontend Docker Image

    # -----------------------------------------------------
    # Save Successfully Scanned Images
    # -----------------------------------------------------

    - script: |
        mkdir -p $(Build.ArtifactStagingDirectory)/docker-images

        docker save \
          taskapp_backend:$(Build.BuildId) \
          -o $(Build.ArtifactStagingDirectory)/docker-images/taskapp_backend.tar

        docker save \
          taskapp_frontend:$(Build.BuildId) \
          -o $(Build.ArtifactStagingDirectory)/docker-images/taskapp_frontend.tar
      displayName: Save Scanned Docker Images

    # -----------------------------------------------------
    # Publish Images For Next Stage
    # -----------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: Publish Scanned Docker Images
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/docker-images'
        artifact: 'docker-images'
        publishLocation: 'pipeline'


# =========================================================
# STAGE 5 - PUSH SCANNED IMAGES TO ACR
# =========================================================

- stage: PushToACR
  displayName: Push Docker Images to ACR
  dependsOn: BuildAndImageScan
  condition: succeeded()

  jobs:
  - job: PushImages
    displayName: Push Backend and Frontend Images

    steps:

    # -----------------------------------------------------
    # Download Scanned Images
    # -----------------------------------------------------

    - task: DownloadPipelineArtifact@2
      displayName: Download Scanned Docker Images
      inputs:
        artifact: 'docker-images'
        path: '$(Pipeline.Workspace)/docker-images'

    # -----------------------------------------------------
    # Load Images
    # -----------------------------------------------------

    - script: |
        docker load \
          -i $(Pipeline.Workspace)/docker-images/taskapp_backend.tar

        docker load \
          -i $(Pipeline.Workspace)/docker-images/taskapp_frontend.tar
      displayName: Load Scanned Docker Images

    # -----------------------------------------------------
    # Login To Azure Container Registry
    # -----------------------------------------------------

    - task: Docker@2
      displayName: Login to Azure Container Registry
      inputs:
        command: 'login'
        containerRegistry: 'taskapp-acr-service-connection'

    # -----------------------------------------------------
    # Tag Images
    # -----------------------------------------------------

    - script: |
        docker tag \
          taskapp_backend:$(Build.BuildId) \
          taskappacr247.azurecr.io/taskapp_backend:$(Build.BuildId)

        docker tag \
          taskapp_backend:$(Build.BuildId) \
          taskappacr247.azurecr.io/taskapp_backend:latest

        docker tag \
          taskapp_frontend:$(Build.BuildId) \
          taskappacr247.azurecr.io/taskapp_frontend:$(Build.BuildId)

        docker tag \
          taskapp_frontend:$(Build.BuildId) \
          taskappacr247.azurecr.io/taskapp_frontend:latest
      displayName: Tag Docker Images

    # -----------------------------------------------------
    # Push Images
    # -----------------------------------------------------

    - script: |
        docker push taskappacr247.azurecr.io/taskapp_backend:$(Build.BuildId)
        docker push taskappacr247.azurecr.io/taskapp_backend:latest

        docker push taskappacr247.azurecr.io/taskapp_frontend:$(Build.BuildId)
        docker push taskappacr247.azurecr.io/taskapp_frontend:latest
      displayName: Push Docker Images To ACR


# =========================================================
# STAGE 6 - DEPLOY BACKEND
# =========================================================

- stage: DeployBackend
  displayName: Deploy Backend
  dependsOn: PushToACR
  condition: succeeded()

  jobs:
  - job: DeployBackendApp
    displayName: Deploy Backend App Service

    steps:

    - task: AzureWebAppContainer@1
      displayName: Deploy Backend Container
      inputs:
        azureSubscription: 'taskapp-azure-service-connection'
        appName: 'taskapp-backend247'
        containers: 'taskappacr247.azurecr.io/taskapp_backend:$(Build.BuildId)'


# =========================================================
# STAGE 7 - DEPLOY FRONTEND
# =========================================================

- stage: DeployFrontend
  displayName: Deploy Frontend
  dependsOn: DeployBackend
  condition: succeeded()

  jobs:
  - job: DeployFrontendApp
    displayName: Deploy Frontend App Service

    steps:

    - task: AzureWebAppContainer@1
      displayName: Deploy Frontend Container
      inputs:
        azureSubscription: 'taskapp-azure-service-connection'
        appName: 'taskapp-web247'
        containers: 'taskappacr247.azurecr.io/taskapp_frontend:$(Build.BuildId)'
