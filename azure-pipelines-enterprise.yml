# Enterprise-style Azure DevOps pipeline for FastAPI + React.
# This pipeline demonstrates PR validation, Terraform checks, security scanning,
# Docker image publishing to ACR, Key Vault secret loading, and Dev/Staging/Prod deployments.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  # Azure DevOps service connection with rights to your Azure subscription.
  azureServiceConnection: fastapi-azure-sp

  # Azure Container Registry service connection.
  acrServiceConnection: fastapi-acr

  # ACR login server, for example: myregistry.azurecr.io
  acrLoginServer: CHANGE_ME.azurecr.io

  # Image names inside ACR.
  backendImageName: fastapi-todo-backend
  frontendImageName: fastapi-todo-frontend

  # Terraform location.
  terraformWorkingDirectory: infra

  # Key Vault names per environment.
  devKeyVaultName: kv-fastapi-dev
  stagingKeyVaultName: kv-fastapi-staging
  prodKeyVaultName: kv-fastapi-prod

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Validate
    displayName: PR Validation and Security Checks
    jobs:
      - job: ValidateCodeAndInfra
        displayName: Validate code, Docker, Terraform, and secrets
        steps:
          - checkout: self
            fetchDepth: 0

          - script: |
              python --version
              pip install -r Backend/requirements.txt
            displayName: Install backend dependencies

          - script: |
              cd frontend
              npm ci
              npm run build
            displayName: Build React frontend

          - script: docker compose build
            displayName: Validate Docker Compose build

          - script: |
              curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /tmp/trivy
              /tmp/trivy fs --severity HIGH,CRITICAL --exit-code 1 .
            displayName: Dependency and filesystem vulnerability scan

          - script: |
              docker build -t local-backend-scan:$(Build.BuildId) Backend
              docker build -t local-frontend-scan:$(Build.BuildId) frontend
              /tmp/trivy image --severity HIGH,CRITICAL --exit-code 1 local-backend-scan:$(Build.BuildId)
              /tmp/trivy image --severity HIGH,CRITICAL --exit-code 1 local-frontend-scan:$(Build.BuildId)
            displayName: Container image vulnerability scan

          - script: |
              curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh | sh -s -- -b /tmp
              /tmp/gitleaks detect --source . --verbose --redact
            displayName: Secret detection scan

          - script: |
              cd $(terraformWorkingDirectory)
              terraform fmt -check -recursive
              terraform init -backend=false
              terraform validate
            displayName: Terraform fmt and validate

          - script: |
              curl -sSfL https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash -s -- /tmp
              /tmp/tfsec $(terraformWorkingDirectory) --minimum-severity HIGH
            displayName: Terraform IaC security scan

  - stage: PublishImages
    displayName: Build and Push Images to ACR
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: BuildAndPush
        displayName: Publish tagged Docker images
        steps:
          - checkout: self

          - task: Docker@2
            displayName: Login to ACR
            inputs:
              command: login
              containerRegistry: $(acrServiceConnection)

          - task: Docker@2
            displayName: Build and push backend image
            inputs:
              command: buildAndPush
              repository: $(backendImageName)
              dockerfile: Backend/Dockerfile
              containerRegistry: $(acrServiceConnection)
              tags: |
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: Build and push frontend image
            inputs:
              command: buildAndPush
              repository: $(frontendImageName)
              dockerfile: frontend/Dockerfile
              containerRegistry: $(acrServiceConnection)
              tags: |
                $(Build.BuildId)
                latest

  - stage: TerraformPlan
    displayName: Terraform Plan
    dependsOn: PublishImages
    condition: succeeded()
    jobs:
      - job: Plan
        displayName: Terraform plan with remote state
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Terraform init and plan
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                cd $(terraformWorkingDirectory)
                terraform init
                terraform plan \
                  -var="container_registry_login_server=$(acrLoginServer)" \
                  -var="backend_image=$(backendImageName):$(Build.BuildId)" \
                  -var="frontend_image=$(frontendImageName):$(Build.BuildId)"

  - stage: DeployDev
    displayName: Deploy Dev
    dependsOn: TerraformPlan
    condition: succeeded()
    jobs:
      - deployment: Dev
        displayName: Deploy to Dev App Service
        environment: fastapi-dev
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureKeyVault@2
                  displayName: Load Dev secrets from Key Vault
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    KeyVaultName: $(devKeyVaultName)
                    SecretsFilter: '*'

                - task: AzureWebAppContainer@1
                  displayName: Deploy frontend container to Dev
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appName: app-fastapi-todo-dev
                    containers: $(acrLoginServer)/$(frontendImageName):$(Build.BuildId)

  - stage: ApproveStaging
    displayName: Approve Staging
    dependsOn: DeployDev
    condition: succeeded()
    jobs:
      - job: ManualApproval
        pool: server
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 1440
            inputs:
              instructions: Approve deployment to Staging.
              onTimeout: reject

  - stage: DeployStaging
    displayName: Deploy Staging
    dependsOn: ApproveStaging
    condition: succeeded()
    jobs:
      - deployment: Staging
        displayName: Deploy to Staging App Service
        environment: fastapi-staging
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureKeyVault@2
                  displayName: Load Staging secrets from Key Vault
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    KeyVaultName: $(stagingKeyVaultName)
                    SecretsFilter: '*'

                - task: AzureWebAppContainer@1
                  displayName: Deploy frontend container to Staging
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appName: app-fastapi-todo-staging
                    containers: $(acrLoginServer)/$(frontendImageName):$(Build.BuildId)

  - stage: ApproveProduction
    displayName: Approve Production
    dependsOn: DeployStaging
    condition: succeeded()
    jobs:
      - job: ManualApproval
        pool: server
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 1440
            inputs:
              instructions: Approve deployment to Production.
              onTimeout: reject

  - stage: DeployProduction
    displayName: Deploy Production
    dependsOn: ApproveProduction
    condition: succeeded()
    jobs:
      - deployment: Production
        displayName: Deploy to Production App Service
        environment: fastapi-production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureKeyVault@2
                  displayName: Load Production secrets from Key Vault
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    KeyVaultName: $(prodKeyVaultName)
                    SecretsFilter: '*'

                - task: AzureWebAppContainer@1
                  displayName: Deploy frontend container to Production
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appName: app-fastapi-todo-prod
                    containers: $(acrLoginServer)/$(frontendImageName):$(Build.BuildId)
